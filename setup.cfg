[metadata]
name = myapp
version = attr: myapp.__version__
description = An enterprise-level terminal application
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12

[options.packages.find]
where = src
exclude =
    tests*
    docs*

[options.entry_points]
console_scripts =
    myapp = myapp.cli:main

[flake8]
max-line-length = 100
extend-ignore = E203, E266, E501, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    .eggs,
    docs
per-file-ignores =
    __init__.py:F401
max-complexity = 10

